<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GKD Rule Studio · 公告发布系统</title>
  <style>
    :root {
      --bg-base: #0b1118;
      --bg-card: #131d27;
      --bg-card-sub: #0f1620;
      --border: rgba(139, 154, 172, 0.2);
      --border-focus: #4ec48e;
      --text: #e6eef6;
      --text-muted: #8e9fab;
      --primary: #4ec48e;
      --primary-hover: #5ad49c;
      --primary-gradient: linear-gradient(180deg, #379167, #1e654a);
      --blue: #70b8ff;
      --danger: #ff6b6b;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-base);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
    }
    .brand-badge {
      background: rgba(78, 196, 142, 0.15);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      border: 1px solid rgba(78, 196, 142, 0.3);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      transition: all 150ms ease;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.1); }
    .btn-primary {
      background: var(--primary-gradient);
      border-color: rgba(78, 196, 142, 0.5);
      color: #fff;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
    }
    .btn-primary:hover {
      background: linear-gradient(180deg, #41a074, #227454);
      border-color: rgba(112, 225, 166, 0.7);
    }
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      flex: 1;
    }
    .login-box {
      max-width: 380px;
      margin: 60px auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    .login-box h2 { font-size: 18px; font-weight: 600; text-align: center; }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }
    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card-sub);
      color: var(--text);
      font-size: 14px;
      outline: none;
      font-family: inherit;
      transition: border-color 150ms ease;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(78, 196, 142, 0.2);
    }
    textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.6;
    }
    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.95fr);
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 860px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .type-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--bg-card-sub);
      padding: 4px;
      border-radius: 8px;
    }
    .type-btn {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      transition: all 150ms;
    }
    .type-btn.active {
      background: var(--bg-card);
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      color: var(--text-muted);
    }
    .checkbox-row input {
      width: 17px;
      height: 17px;
      accent-color: var(--primary);
    }
    /* 实时手机预览框 */
    .preview-frame {
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 18px 14px;
      background: #06090e;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .preview-phone-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #667688;
      padding: 0 6px;
    }
    .preview-popup {
      border: 1px solid rgba(139, 154, 172, 0.25);
      border-radius: 16px;
      background: #111a24;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }
    .preview-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .preview-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .preview-badge.notice { background: rgba(78, 196, 142, 0.2); color: #4ec48e; }
    .preview-badge.update { background: rgba(112, 184, 255, 0.2); color: #70b8ff; }
    .preview-title {
      font-size: 15px;
      font-weight: 600;
      color: #f3f7fb;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .preview-body {
      background: #090f17;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.6;
      color: #cbd5e1;
      white-space: pre-wrap;
      max-height: 220px;
      overflow-y: auto;
      word-break: break-word;
    }
    .preview-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .preview-btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e2c3a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      z-index: 1000;
      display: none;
      animation: toast-in 180ms ease;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, 10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .history-item {
      background: var(--bg-card-sub);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .history-meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .history-title { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-time { font-size: 11px; color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>GKD Rule Studio</span>
      <span class="brand-badge">公告发布系统</span>
    </div>
    <div class="header-actions" id="headerActions" style="display: none;">
      <span id="currentStatusIndicator" style="font-size: 12px; color: #4ec48e;">● 手机端已启用</span>
      <button class="btn" onclick="logout()">退出</button>
    </div>
  </header>

  <div class="container">
    <!-- 登录模块 -->
    <div id="loginView" class="login-box">
      <h2>管理员登录</h2>
      <div class="form-group">
        <label class="form-label">管理密码</label>
        <input type="password" id="passwordInput" placeholder="输入管理口令" autofocus onkeydown="if(event.key==='Enter')login()">
      </div>
      <button class="btn btn-primary" onclick="login()" style="width: 100%; padding: 10px;">立即登录</button>
      <p style="font-size: 12px; color: var(--text-muted); text-align: center;">可在部署环境中配置 ADMIN_PASSWORD 变量</p>
    </div>

    <!-- 操作仪表盘 -->
    <div id="dashboardView" class="dashboard-grid" style="display: none;">
      <!-- 左侧：编辑表单 -->
      <div class="card">
        <div class="card-title">
          <span>发布新内容</span>
          <label class="checkbox-row" style="font-weight: normal;">
            <input type="checkbox" id="enabledInput" checked onchange="updatePreview()">
            <span>全网弹窗总开关</span>
          </label>
        </div>

        <div class="form-group">
          <label class="form-label">公告类型</label>
          <div class="type-switcher">
            <button type="button" id="typeNoticeBtn" class="type-btn active" onclick="setType('notice')">💬 普通公告 / 留言</button>
            <button type="button" id="typeUpdateBtn" class="type-btn" onclick="setType('update')">🚀 新版本发布 (APK)</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">公告标题</label>
          <input type="text" id="titleInput" placeholder="例如：关于近期规则更新的说明" oninput="updatePreview()">
        </div>

        <div class="form-group">
          <label class="form-label">
            <span>公告正文</span>
            <span style="float: right; font-weight: normal; font-size: 11px;">支持网址自动识别为蓝字超链接</span>
          </label>
          <textarea id="contentInput" placeholder="输入你想跟用户说的话或更新日志。支持回车换行；输入 https://... 链接手机端可直接点击。" oninput="updatePreview()"></textarea>
        </div>

        <!-- 版本更新专用字段 -->
        <div id="updateFields" style="display: none; flex-direction: column; gap: 12px; border-top: 1px dashed var(--border); padding-top: 12px;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="form-group">
              <label class="form-label">版本号（如 0.2.2）</label>
              <input type="text" id="versionNameInput" placeholder="0.2.2" oninput="updatePreview()">
            </div>
            <div class="form-group">
              <label class="form-label">版本代码（如 202）</label>
              <input type="text" id="versionCodeInput" placeholder="202">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">APK 下载直链</label>
            <input type="text" id="apkUrlInput" placeholder="https://github.com/.../app-release.apk">
          </div>
        </div>

        <!-- 自定义外链按钮 -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label">附加按钮名称（选填）</label>
            <input type="text" id="actionTextInput" placeholder="例如：加入交流群" oninput="updatePreview()">
          </div>
          <div class="form-group">
            <label class="form-label">附加链接（选填）</label>
            <input type="text" id="actionUrlInput" placeholder="例如：https://..." oninput="updatePreview()">
          </div>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="forcedInput" onchange="updatePreview()">
          <span>紧急强提醒（日常请勿勾选；开启后用户每次打开软件都会强制弹窗）</span>
        </label>

        <div style="display: flex; gap: 10px; margin-top: 6px;">
          <button class="btn btn-primary" onclick="publish()" style="flex: 1; min-height: 42px; font-size: 14px;">
            ⚡ 立即发布到全网
          </button>
          <button class="btn" onclick="loadStatus()">撤销未保存改动</button>
        </div>
      </div>

      <!-- 右侧：实时手机端真机预览与历史 -->
      <div style="display: flex; flex-direction: column; gap: 20px;">
        <div class="card">
          <div class="card-title">
            <span>📱 手机端真实弹窗模拟</span>
            <span style="font-size: 11px; color: var(--text-muted);">实时所见即所得</span>
          </div>

          <div class="preview-frame">
            <div class="preview-phone-header">
              <span>12:00</span>
              <span>5G 100%</span>
            </div>
            <div class="preview-popup">
              <div class="preview-title-row">
                <div id="previewBadge" class="preview-badge notice">📢</div>
                <div style="display: flex; flex-direction: column; min-width: 0;">
                  <div id="previewTitle" class="preview-title">公告标题</div>
                  <div style="display: flex; gap: 4px; margin-top: 2px;">
                    <span id="previewTagType" class="brand-badge" style="font-size: 10px; padding: 0 4px;">普通公告</span>
                    <span id="previewTagForced" class="brand-badge" style="display: none; background: rgba(255,107,107,0.2); color: #ff8e8e; font-size: 10px; padding: 0 4px;">强提醒</span>
                  </div>
                </div>
              </div>
              <div id="previewBody" class="preview-body">公告内容预览...</div>
              <div class="preview-actions">
                <span id="previewActionBtn" class="btn preview-btn" style="display: none;">加入交流群 ↗</span>
                <span id="previewSecondBtn" class="btn preview-btn" style="display: none;">稍后再说</span>
                <span id="previewMainBtn" class="btn btn-primary preview-btn">我知道了</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 历史记录卡片 -->
        <div class="card">
          <div class="card-title">
            <span>📜 历史发布记录</span>
          </div>
          <div id="historyList" style="display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto;">
            <div style="color: var(--text-muted); font-size: 12px; text-align: center; padding: 12px;">暂无历史记录</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    let currentToken = localStorage.getItem("gkd_admin_token") || "";
    let currentType = "notice";
    let historyData = [];

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 2500);
    }

    async function login() {
      const pwd = document.getElementById("passwordInput").value;
      if (!pwd) return showToast("请输入管理口令");
      try {
        const res = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: pwd })
        });
        const data = await res.json();
        if (data.success) {
          currentToken = data.token;
          localStorage.setItem("gkd_admin_token", currentToken);
          showDashboard();
          loadStatus();
        } else {
          showToast(data.message || "密码错误");
        }
      } catch {
        showToast("连接服务器失败");
      }
    }

    function logout() {
      currentToken = "";
      localStorage.removeItem("gkd_admin_token");
      document.getElementById("loginView").style.display = "flex";
      document.getElementById("dashboardView").style.display = "none";
      document.getElementById("headerActions").style.display = "none";
    }

    function showDashboard() {
      document.getElementById("loginView").style.display = "none";
      document.getElementById("dashboardView").style.display = "grid";
      document.getElementById("headerActions").style.display = "flex";
    }

    function setType(type) {
      currentType = type;
      document.getElementById("typeNoticeBtn").classList.toggle("active", type === "notice");
      document.getElementById("typeUpdateBtn").classList.toggle("active", type === "update");
      document.getElementById("updateFields").style.display = type === "update" ? "flex" : "none";
      updatePreview();
    }

    function updatePreview() {
      const title = document.getElementById("titleInput").value.trim() || "公告标题";
      const content = document.getElementById("contentInput").value.trim() || "在此处输入你想传达给用户的内容...";
      const isUpdate = currentType === "update";
      const forced = document.getElementById("forcedInput").checked;
      const actionText = document.getElementById("actionTextInput").value.trim();
      const versionName = document.getElementById("versionNameInput").value.trim();

      document.getElementById("previewTitle").innerText = title;
      document.getElementById("previewBody").innerText = content;

      const badge = document.getElementById("previewBadge");
      badge.className = `preview-badge ${isUpdate ? "update" : "notice"}`;
      badge.innerText = isUpdate ? "🚀" : "📢";

      const tagType = document.getElementById("previewTagType");
      tagType.innerText = isUpdate ? (versionName ? `v${versionName}` : "版本更新") : "普通公告";
      tagType.style.color = isUpdate ? "#70b8ff" : "#4ec48e";
      tagType.style.borderColor = isUpdate ? "rgba(112, 184, 255, 0.3)" : "rgba(78, 196, 142, 0.3)";

      document.getElementById("previewTagForced").style.display = forced ? "inline" : "none";

      const actionBtn = document.getElementById("previewActionBtn");
      if (actionText) {
        actionBtn.innerText = `${actionText} ↗`;
        actionBtn.style.display = "inline-flex";
      } else {
        actionBtn.style.display = "none";
      }

      const secondBtn = document.getElementById("previewSecondBtn");
      const mainBtn = document.getElementById("previewMainBtn");
      if (isUpdate) {
        secondBtn.style.display = forced ? "none" : "inline-flex";
        secondBtn.innerText = "稍后再说";
        mainBtn.innerText = "立即更新";
      } else {
        secondBtn.style.display = "none";
        mainBtn.innerText = "我知道了";
      }
    }

    async function loadStatus() {
      if (!currentToken) return;
      try {
        const res = await fetch("/api/admin/status", {
          headers: { Authorization: `Bearer ${currentToken}` }
        });
        if (res.status === 401) return logout();
        const data = await res.json();
        if (data.success && data.current) {
          const c = data.current;
          document.getElementById("enabledInput").checked = Boolean(c.enabled);
          document.getElementById("titleInput").value = c.title || "";
          document.getElementById("contentInput").value = c.content || "";
          document.getElementById("forcedInput").checked = Boolean(c.forced);
          document.getElementById("versionNameInput").value = c.versionName || "";
          document.getElementById("versionCodeInput").value = c.versionCode || "";
          document.getElementById("apkUrlInput").value = c.apkUrl || "";
          document.getElementById("actionTextInput").value = c.actionText || "";
          document.getElementById("actionUrlInput").value = c.actionUrl || "";
          setType(c.type || "notice");

          const statusIndicator = document.getElementById("currentStatusIndicator");
          if (c.enabled) {
            statusIndicator.innerText = "● 手机端已启用";
            statusIndicator.style.color = "#4ec48e";
          } else {
            statusIndicator.innerText = "○ 手机端已停用";
            statusIndicator.style.color = "#8e9fab";
          }

          historyData = data.history || [];
          renderHistory();
        }
      } catch {
        showToast("无法读取最新配置");
      }
    }

    function renderHistory() {
      const list = document.getElementById("historyList");
      if (!historyData || historyData.length === 0) {
        list.innerHTML = `<div style="color: var(--text-muted); font-size: 12px; text-align: center; padding: 12px;">暂无历史记录</div>`;
        return;
      }
      list.innerHTML = historyData.map((item, idx) => `
        <div class="history-item">
          <div class="history-meta">
            <div class="history-title">${item.title || "未命名公告"}</div>
            <div class="history-time">${item.updatedAt || ""} · ${item.type === "update" ? "版本更新" : "普通公告"}</div>
          </div>
          <button class="btn" style="padding: 4px 10px; font-size: 11px;" onclick="restoreHistory(${idx})">载入</button>
        </div>
      `).join("");
    }

    function restoreHistory(idx) {
      const item = historyData[idx];
      if (!item) return;
      document.getElementById("titleInput").value = item.title || "";
      document.getElementById("contentInput").value = item.content || "";
      document.getElementById("forcedInput").checked = Boolean(item.forced);
      document.getElementById("versionNameInput").value = item.versionName || "";
      document.getElementById("versionCodeInput").value = item.versionCode || "";
      document.getElementById("apkUrlInput").value = item.apkUrl || "";
      document.getElementById("actionTextInput").value = item.actionText || "";
      document.getElementById("actionUrlInput").value = item.actionUrl || "";
      setType(item.type || "notice");
      showToast("已载入选中的历史公告内容，点击【立即发布】即可生效");
    }

    async function publish() {
      const title = document.getElementById("titleInput").value.trim();
      const content = document.getElementById("contentInput").value.trim();
      if (!title || !content) {
        return showToast("请填写完整的标题和正文");
      }
      const payload = {
        enabled: document.getElementById("enabledInput").checked,
        type: currentType,
        title,
        content,
        forced: document.getElementById("forcedInput").checked,
        versionName: document.getElementById("versionNameInput").value.trim(),
        versionCode: document.getElementById("versionCodeInput").value.trim(),
        apkUrl: document.getElementById("apkUrlInput").value.trim(),
        actionText: document.getElementById("actionTextInput").value.trim(),
        actionUrl: document.getElementById("actionUrlInput").value.trim(),
      };

      try {
        const res = await fetch("/api/admin/publish", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${currentToken}`
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          if (data.pushed) {
            showToast("🎉 发布并已推送到 GitHub！由于 CDN 缓存，手机端约 1-3 分钟内收到。");
          } else {
            showToast("⚠️ 已保存到本地，但自动推送 GitHub 失败：" + (data.pushError || "请手动 git push"));
          }
          loadStatus();
        } else {
          showToast(data.message || "发布失败");
        }
      } catch {
        showToast("网络异常，发布失败");
      }
    }

    // 初始化页面
    if (currentToken) {
      showDashboard();
      loadStatus();
    }
  </script>
</body>
</html>
