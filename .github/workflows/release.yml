name: Release APK

# 打 tag（v*）时构建 APK 并发布，同时生成 update.json 更新清单。
# 关键：APK 与 update.json 必须一起发布——App 的「检查更新」请求
# releases/latest/download/update.json，缺了这个资产就会 404。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: ./scripts/windows-pnpm.ps1 install --frozen-lockfile

      - name: Typecheck and test
        run: |
          ./scripts/windows-pnpm.ps1 typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/windows-pnpm.ps1 test

      - name: Build web assets into Android
        run: ./scripts/windows-pnpm.ps1 run build:android-assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # 默认值是 "tools platform-tools"，但 SDK 仓库已移除 tools 包，
          # 会导致 sdkmanager 报 "Failed to find package 'tools'" 而失败。
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: android
        # 覆盖本机 Gradle 配置，使用 CI 安装的 JDK。
        run: |
          ./gradlew.bat assembleDebug "-Dorg.gradle.java.home=$env:JAVA_HOME"

      - name: Generate update.json
        # --apk-name 必须与上传的资产名一致，否则清单里的下载直链会 404。
        run: |
          node scripts/publish-update.mjs android/app/build/outputs/apk/debug/app-debug.apk --apk-name app-debug.apk --output update.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content update.json

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            update.json
